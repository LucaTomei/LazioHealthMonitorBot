services:
  telegram-bot:
    image: ghcr.io/lucatomei/laziohealthmonitorbot:latest
    
    container_name: telegram-monitoring-bot
    restart: unless-stopped
    
    # Environment variables
    environment:
      - TZ=Europe/Rome
      - PYTHONUNBUFFERED=1
      # Add your environment variables here or use env_file
    
    # Usa file .env per variabili sensibili
    env_file:
      - .env
    
    # Volumes for persistent data
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./reports_pdf:/app/reports_pdf
      - ./prenotazioni_pdf:/app/prenotazioni_pdf
      - ./debug_responses:/app/debug_responses
    
    # Network mode
    network_mode: bridge
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Health check: definito nel Dockerfile (heartbeat del ciclo di monitoraggio)

# Networks
networks:
  default:
    name: telegram-bot-network
